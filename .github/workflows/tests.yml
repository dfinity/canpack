name: Tests

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - name: Install dfx
        uses: dfinity/setup-dfx@e50c04f104ee4285ec010f10609483cf41e4d365 # main
      - name: Install Mops
        run: npm i -g ic-mops
      - run: dfx cache install
      - run: npm ci
      - run: npm run build --if-present
      - run: npm test
      - name: Run CLI with `--version`
        run: bin/canpack.cjs --version
      - name: Run Canpack in `tests/dfx` directory
        run: npm run build && bin/canpack.cjs -D tests/dfx
